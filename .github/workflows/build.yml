name: Build

on:
  push:
    branches:
      - "**"
      - "!main"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".sdkmanrc"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Temporary write permission for one wrapper-repair run. This is reverted after the generated
# Gradle 9.8 wrapper is committed by Git itself, so the binary is never rewritten by an API client.
permissions:
  contents: write

jobs:
  build:
    name: Repair wrapper, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up standalone Gradle 9.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"
          validate-wrappers: false

      - name: Regenerate and verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper \
            --gradle-version 9.8.0 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
          echo '238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          ./gradlew --version

      - name: Prepare test resource layout
        run: mkdir -p resources/BinOutput resources/ExcelBinOutput

      - name: Verify build
        run: >-
          ./gradlew jar test --build-cache
          -PskipHandbook=1
          -PjarFilename=grasscutter
          -PexcludeTags=integration
          -Dorg.gradle.jvmargs=-Xmx4g

      - name: Commit generated Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already matches Gradle 9.8 output."
            exit 0
          fi
          git commit -m "build: regenerate Gradle 9.8 wrapper [skip ci]"
          git fetch origin play/rino
          git rebase origin/play/rino
          git push origin HEAD:play/rino

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: grasscutter
          path: grasscutter.jar
          retention-days: 14
