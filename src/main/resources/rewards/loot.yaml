# Historical chest drop data. These tables are preserved for research and
# explicit selection; the bundled rewards.css does not currently select them.
# Original datasets: AstaPS-Resource/Server/DropTableExcelConfigData.json and
# Server/DropSubTableExcelConfigData.json (chest source tables and dependencies).
# 108 historical root tables, 571 dependent pools, 1,843 positive-weight entries.
# Names describe region, chest source, grade, and contents; e.g.
# astaps.loot.historical_mondstadt_combat_common.
# YAML anchors connect the nested pools. The tables contain no location,
# combat, puzzle, rank, or other selector logic.
# Every item uses a descriptive genshin.item.<name> resource identity.
# Actual numeric resource mappings live only in ItemIdRegistry, not this file.
# Native weighted choices and independent rolls are retained; common weight
# factors are removed without changing probability ratios.
# Empty pools and conditional drops are kept as in the historical resources.
# The historical distribution has not been validated against Genshin 7.1.

