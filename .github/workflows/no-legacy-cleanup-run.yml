name: No legacy cleanup run

on:
  push:
    branches:
      - maintenance/no-legacy-cleanup-run

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experiment/no-legacy-fallback
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply no-legacy cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              result, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return result

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          db_path = Path('src/main/java/emu/grasscutter/database/DatabaseHelper.java')
          db = db_path.read_text()
          db = replace_once(db, 'import at.favre.lib.crypto.bcrypt.BCrypt;\n', '', 'DatabaseHelper BCrypt import')

          db = sub_once(
              db,
              r'\n    /\*\*\n     \* The prefix used before the ban reason was in English\..*?\n    private static final String LEGACY_IP_BAN_REASON_PREFIX = .*?;\n',
              '\n',
              'legacy IP-ban prefix',
              re.S)

          current_ip_lookup = '''    /** Every account that was banned because of this IP. */
          public static List<Account> getAccountsBannedByIp(String ip) {
              if (ip == null) return List.of();
              return DatabaseManager.getAccountDatastore()
                      .find(Account.class)
                      .filter(Filters.eq("bannedByIp", ip))
                      .iterator()
                      .toList();
          }

          '''
          db = sub_once(
              db,
              r'    /\*\*\n     \* Every account that was banned because of this IP\..*?(?=    /\*\* Lifts the ban)',
              current_ip_lookup,
              'legacy IP-ban lookup',
              re.S)

          current_account_api = '''    /** Creates an account with a password and optional email address. */
          public static Account createAccountWithPassword(
                  String username, String password, String email) {
              if (DatabaseHelper.getAccountByName(username) != null) return null;

              var account = new Account();
              account.setId(Integer.toString(DatabaseManager.getNextId(account)));
              account.setUsername(username);
              account.setPassword(password);
              if (email != null && !email.isBlank()) account.setEmail(email);
              DatabaseHelper.saveAccount(account);
              return account;
          }

          public static Account createAccountWithPassword(String username, String password) {
              return createAccountWithPassword(username, password, null);
          }

          '''
          db = sub_once(
              db,
              r'    /\*\*\n     \* Creates an account with a hashed password and an email address\..*?(?=    public static void saveAccount\(Account account\))',
              current_account_api,
              'account password API',
              re.S)

          if 'LEGACY_IP_BAN_REASON_PREFIX' in db or 'createAccountWithHashedPassword' in db or 'BCrypt.' in db:
              raise SystemExit('DatabaseHelper still contains retired compatibility/password paths')
          db_path.write_text(db)

          auth_path = Path('src/main/java/emu/grasscutter/auth/DefaultAuthenticators.java')
          auth = auth_path.read_text()
          auth = replace_once(
              auth,
              'DatabaseHelper.createAccountWithHashedPassword(',
              'DatabaseHelper.createAccountWithPassword(',
              'standard account creation call')

          auth = sub_once(
              auth,
              r'account\.setPassword\(\s*BCrypt\.withDefaults\(\)\.hashToString\(10, rawPassword\.toCharArray\(\)\)\);',
              'account.setPassword(rawPassword);',
              'standard first-login password',
              re.S)

          auth = sub_once(
              auth,
              r'account = DatabaseHelper\.createAccountWithUid\(requestData\.account, 0\);\s*account\.setPassword\(\s*BCrypt\.withDefaults\(\)\.hashToString\(12, decryptedPassword\.toCharArray\(\)\)\);\s*account\.save\(\);',
              'account =\n                            DatabaseHelper.createAccountWithPassword(\n                                    requestData.account, decryptedPassword);',
              'experimental account creation',
              re.S)

          auth = sub_once(
              auth,
              r'BCrypt\.verifyer\(\)\s*\.verify\(decryptedPassword\.toCharArray\(\), account\.getPassword\(\)\)\s*\.verified',
              'verifyPassword(account, decryptedPassword)',
              'experimental password verification',
              re.S)

          auth = sub_once(
              auth,
              r'account\.setPassword\(\s*BCrypt\.withDefaults\(\)\s*\.hashToString\(12, decryptedPassword\.toCharArray\(\)\)\);',
              'account.setPassword(decryptedPassword);',
              'experimental first-login password',
              re.S)

          if 'BCrypt.' in auth:
              raise SystemExit('DefaultAuthenticators still hashes/verifies BCrypt directly')
          auth = replace_once(auth, 'import at.favre.lib.crypto.bcrypt.BCrypt;\n', '', 'DefaultAuthenticators BCrypt import')
          auth_path.write_text(auth)

          config_path = Path('src/main/java/emu/grasscutter/config/ConfigContainer.java')
          config = config_path.read_text()
          start = config.index('    /**\n     * Folds any pools the running config already names into the current default set.')
          end = config.index('    public Structure folderStructure = new Structure();', start)
          config = config[:start] + config[end:]
          config = replace_once(config, 'import emu.grasscutter.Grasscutter;\n', '', 'ConfigContainer Grasscutter import')
          if 'updateConfig()' in config or 'mergeThreadPoolDefaults' in config:
              raise SystemExit('ConfigContainer still contains config migration code')
          config_path.write_text(config)

          grass_path = Path('src/main/java/emu/grasscutter/Grasscutter.java')
          grass = grass_path.read_text()
          grass = replace_once(
              grass,
              '        // Attempt to update configuration.\n        ConfigContainer.updateConfig();\n\n',
              '',
              'Grasscutter config migration call')
          grass_path.write_text(grass)

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Format
        run: ./gradlew spotlessApply -PskipHandbook=1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify diff
        run: |
          git diff --check
          ! grep -R "createAccountWithHashedPassword\|LEGACY_IP_BAN_REASON_PREFIX\|ConfigContainer.updateConfig" -n src/main/java

      - name: Build jar
        run: ./gradlew clean jar -PskipHandbook=1 -PjarFilename=grasscutter -Dorg.gradle.jvmargs=-Xmx4g

      - name: Test
        run: ./gradlew test -PexcludeTags=integration -Dorg.gradle.jvmargs=-Xmx4g

      - name: Commit cleanup
        run: |
          git config user.name "Rino"
          git config user.email "71957726+RinoPaw@users.noreply.github.com"
          git add src/main/java/emu/grasscutter/database/DatabaseHelper.java \
                  src/main/java/emu/grasscutter/auth/DefaultAuthenticators.java \
                  src/main/java/emu/grasscutter/config/ConfigContainer.java \
                  src/main/java/emu/grasscutter/Grasscutter.java
          git commit -m "refactor: enforce current account and config formats"
          git push origin HEAD:experiment/no-legacy-fallback
