import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.plugins.ide.eclipse.model.SourceFolder

plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id 'com.diffplug.spotless' version '8.10.3'

    id 'eclipse'
    id 'idea'

    id 'io.freefair.lombok' version '9.8.0'
}

spotless {
    java {
        target fileTree(rootDir) {
            include '**/*.java'
            exclude '**/generated/**/*.*'
            exclude '.idea/**/*.*'
        }

        importOrder('io.grasscutter', '', 'java', 'javax', '\\#java', '\\#')
        googleJavaFormat('1.17.0')
        formatAnnotations()
        endWithNewline()
        leadingSpacesToTabs(2); leadingTabsToSpaces(4)
        toggleOffOn()
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.with {
        // ~5,500 generated protocol classes; with 3000m javac stalls in GC.
        memoryMaximumSize = '6g'
    }
}

compileTestJava.options.encoding = 'UTF-8'

group = 'io.grasscutter'
version = '7.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.release.set(21)
    options.compilerArgs.addAll(['-Xlint:all', '-Xmaxwarns', '100000'])
}

repositories {
    mavenCentral()
}

def nettyVersion = '4.1.138.Final'

dependencies {
    // KCP is a custom/unpublished build and remains vendored until its upstream is identified.
    implementation files('lib/kcp-1.5.1.jar')

    implementation 'at.favre.lib:bcrypt:0.10.2'

    implementation 'it.unimi.dsi:fastutil:8.5.19'

    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation 'ch.qos.logback:logback-core:1.5.36'
    implementation 'ch.qos.logback:logback-classic:1.5.36'

    // Picocli 4.7.7 still depends on the old all-in-one JLine 3.29.0 bundle. Use the current
    // JLine modules explicitly so the console does not mix bundle classes with newer modules.
    implementation 'org.jline:jline-reader:3.30.14'
    implementation 'org.jline:jline-console:3.30.14'
    implementation 'org.jline:jline-terminal-jna:3.30.14'
    implementation 'info.picocli:picocli:4.7.7'
    implementation('info.picocli:picocli-shell-jline3:4.7.7') {
        exclude group: 'org.jline', module: 'jline'
    }

    // KCP uses Netty's core transport APIs plus epoll/kqueue classes. The platform-specific
    // classifier JARs carry the JNI libraries that make Epoll.isAvailable()/KQueue.isAvailable()
    // succeed; without them the server silently falls back to NIO.
    implementation platform("io.netty:netty-bom:${nettyVersion}")
    implementation 'io.netty:netty-common'
    implementation 'io.netty:netty-buffer'
    implementation 'io.netty:netty-transport'
    implementation 'io.netty:netty-transport-classes-epoll'
    implementation 'io.netty:netty-transport-classes-kqueue'
    runtimeOnly "io.netty:netty-transport-native-epoll:${nettyVersion}:linux-x86_64"
    runtimeOnly "io.netty:netty-transport-native-epoll:${nettyVersion}:linux-aarch_64"
    runtimeOnly "io.netty:netty-transport-native-kqueue:${nettyVersion}:osx-x86_64"
    runtimeOnly "io.netty:netty-transport-native-kqueue:${nettyVersion}:osx-aarch_64"

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.protobuf:protobuf-java:4.36.2'

    implementation 'org.reflections:reflections:0.10.2'
    implementation 'com.esotericsoftware:reflectasm:1.11.9'
    implementation 'com.github.davidmoten:rtree-multi:0.1'

    implementation 'dev.morphia.morphia:morphia-core:2.5.3'

    implementation 'org.quartz-scheduler:quartz:2.5.2'

    implementation 'org.luaj:luaj-jse:3.0.1'

    // Javalin 7 moves route registration into startup configuration and runs on Jetty 12.
    implementation 'io.javalin:javalin:7.2.3'
    implementation 'io.javalin.community.ssl:javalin-ssl:7.2.3'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Nullability annotations are source-only dependencies. Keep both APIs explicit instead of
    // relying on transitive dependencies from networking or console libraries.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.jetbrains:annotations:26.1.0'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j'
}

application {
    mainClass.set('emu.grasscutter.Grasscutter')
}

jar {
    exclude '*.proto'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    manifest {
        attributes 'Main-Class': 'emu.grasscutter.Grasscutter'
    }

    archiveBaseName = 'grasscutter'
    if (project.hasProperty('jarFilename')) {
        archiveFileName = "${jarFilename}.${archiveExtension.get()}"
    }

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from('src/main/java') {
        include '*.xml'
    }

    destinationDirectory = file('.')
}

test {
    useJUnitPlatform()
    setMaxHeapSize('4G')
}

def buildConfigOutputDir = layout.buildDirectory.dir('generated/sources/buildConfig/java/main')
def buildInfoOutputDir = layout.buildDirectory.dir('generated/resources/buildInfo/main')

sourceSets {
    main {
        // The legacy protocol dump path is kept empty; protocol Java is generated into build/.
        java {
            srcDir 'src/generated/main/java'
            srcDir buildConfigOutputDir
        }
        resources.srcDir buildInfoOutputDir
    }
}

eclipse {
    classpath {
        file.whenMerged {
            cp -> cp.entries.add(new SourceFolder('src/generated/main/java', null))
        }
    }
}

javadoc {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }

    options.addStringOption('Xdoclint:none', '-quiet')
    exclude '**/*.md'
    exclude 'src/handbook/**/*.*'
    exclude 'src/generated/**/*.*'
}

def legacyBuildConfig = file('src/main/java/emu/grasscutter/BuildConfig.java')
def generatedBuildConfig = buildConfigOutputDir.map { it.file('emu/grasscutter/BuildConfig.java') }
def generatedBuildInfo = buildInfoOutputDir.map { it.file('build-info.properties') }
def gitHashProvider = providers.provider {
    try {
        def process = new ProcessBuilder('git', 'rev-parse', '--verify', '--short', 'HEAD')
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.text.trim()
        if (process.waitFor() == 0 && !output.isEmpty()) {
            return output
        }
    } catch (IOException ignored) {
        // Source archives can build without a .git directory or git executable.
    }
    return 'GIT_NOT_FOUND'
}

tasks.register('generateBuildConfig') {
    group = 'build setup'
    description = 'Generate stable build-version source metadata for the server.'
    inputs.property('version', version.toString())
    outputs.file(generatedBuildConfig)

    doLast {
        if (legacyBuildConfig.exists()) {
            delete legacyBuildConfig
        }

        def outputFile = generatedBuildConfig.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = """package emu.grasscutter;

public final class BuildConfig {
    public static final String VERSION = \"${version}\";
    public static final String GIT_HASH = loadGitHash();

    private static String loadGitHash() {
        try (var stream = BuildConfig.class.getResourceAsStream(\"/build-info.properties\")) {
            if (stream == null) return \"GIT_NOT_FOUND\";
            var properties = new java.util.Properties();
            properties.load(stream);
            return properties.getProperty(\"gitHash\", \"GIT_NOT_FOUND\").trim();
        } catch (java.io.IOException ignored) {
            return \"GIT_NOT_FOUND\";
        }
    }

    private BuildConfig() {}
}
"""
    }
}

tasks.register('generateBuildInfo') {
    group = 'build setup'
    description = 'Generate commit metadata as a runtime resource without invalidating javac.'
    inputs.property('gitHash', gitHashProvider)
    outputs.file(generatedBuildInfo)

    doLast {
        def outputFile = generatedBuildInfo.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = "gitHash=${gitHashProvider.get()}\n"
    }
}

tasks.named('compileJava') {
    dependsOn 'generateBuildConfig'
}

tasks.named('processResources') {
    dependsOn 'generateBuildInfo'
}

tasks.named('sourcesJar') {
    dependsOn 'generateBuildConfig'
}

def handbookDataFiles = [
    'src/handbook/data/commands.json',
    'src/handbook/data/avatars.csv',
    'src/handbook/data/entities.csv',
    'src/handbook/data/items.csv',
    'src/handbook/data/mainquests.csv',
    'src/handbook/data/quests.csv',
    'src/handbook/data/scenes.csv'
]
def handbookNpm = Os.isFamily(Os.FAMILY_WINDOWS) ? 'npm.cmd' : 'npm'

tasks.register('generateHandbook', Exec) {
    group = 'documentation'
    description = 'Install handbook dependencies when handbook source data is available.'
    workingDir 'src/handbook'
    commandLine handbookNpm, 'install'

    onlyIf {
        if (project.hasProperty('skipHandbook')) {
            logger.lifecycle('Skipping handbook generation.')
            return false
        }

        def missingData = handbookDataFiles.find { !file(it).exists() }
        if (missingData != null) {
            logger.lifecycle("${missingData} was not found. Skipping handbook generation.")
            return false
        }

        try {
            def process = new ProcessBuilder(handbookNpm, '--version')
                    .redirectErrorStream(true)
                    .start()
            process.inputStream.text
            if (process.waitFor() != 0) {
                logger.lifecycle('NPM is not available. Skipping handbook generation.')
                return false
            }
        } catch (IOException ignored) {
            logger.lifecycle('NPM is not installed. Skipping handbook generation.')
            return false
        }

        return true
    }
}

run {
    standardInput = System.in
}

apply from: 'gradle/protocol-generation.gradle'
