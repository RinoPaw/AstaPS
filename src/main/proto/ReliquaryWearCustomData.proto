syntax = "proto3";
option java_package = "emu.grasscutter.net.proto";

import "Uint32Pair.proto";

message ReliquaryWearCustomData {
  repeated uint32 main_prop_type_list = 1;
  uint32 _avatar_element_type = 3;
  uint32 index = 4;
  repeated uint32 reliquary_set_id_list = 6;
  bool is_all = 8;
  repeated Uint32Pair main_prop_type_map = 10;
  uint32 avatar_id = 11;
  repeated uint32 append_prop_type_list = 14;
}
