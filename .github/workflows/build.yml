name: Build

on:
  # Every in-repo branch is covered here, and GitHub attaches these runs to any PR opened from one,
  # so a pull_request trigger would only build the same commit a second time.
  push:
    branches:
      - "**"
      # main is covered by the release workflow, which builds the same way.
      - "!main"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AstaPS uses Java 21 APIs and emits Java 21 bytecode.
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the execute bit.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test command shell and build jar
        run: >
          ./gradlew test
          --tests 'emu.grasscutter.command.JLine4ShellSmokeTest'
          --tests 'emu.grasscutter.command.CommandMapParsingTest'
          --tests 'emu.grasscutter.command.CommandResultTest'
          --tests 'emu.grasscutter.command.commands.LookupCommandTest'
          --tests 'emu.grasscutter.command.commands.SensitiveCommandSyntaxTest'
          --tests 'emu.grasscutter.command.commands.ReloadAndStopCommandTest'
          --tests 'emu.grasscutter.command.commands.SayCommandTest'
          --tests 'emu.grasscutter.command.commands.CommandRedundancyTest'
          jar -PskipHandbook=1 -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: grasscutter
          path: grasscutter-7.2.0.jar
          retention-days: 14
