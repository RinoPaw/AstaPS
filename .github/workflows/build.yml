name: Build

on:
  push:
    branches:
      - "**"
      - "!main"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".sdkmanrc"
      - "LICENSE*"
  workflow_dispatch:

# Keep the repair run alive if another play/rino commit lands while Gradle is regenerating the JAR.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Temporary. Reverted as soon as the official Gradle-generated wrapper commit lands.
permissions:
  contents: write

jobs:
  build:
    name: Repair Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up standalone Gradle 9.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"
          validate-wrappers: false

      - name: Regenerate and verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper \
            --gradle-version 9.8.0 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
          echo '238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          ./gradlew --version

      - name: Commit generated Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already matches Gradle 9.8 output."
            exit 0
          fi
          git commit -m "build: regenerate Gradle 9.8 wrapper [skip ci]"
          git fetch origin play/rino
          git rebase origin/play/rino
          git push origin HEAD:play/rino
