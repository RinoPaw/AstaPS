name: Protocol generation

on:
  push:
    branches:
      - "**"
    paths:
      - "protocol/**"
      - "tools/protocol/**"
      - "gradle/protocol-generation.gradle"
      - "build.gradle"
      - "src/test/java/emu/grasscutter/net/ProtocolGenerationTest.java"
      - ".github/workflows/protocol-generation.yml"
  workflow_dispatch:

concurrency:
  group: protocol-generation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Generate, build, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The repository-wide test suite has known unrelated failures. This gate compiles the full
      # production jar, runs the protocol regression test, and separately compiles only regenerated
      # protocol sources with -Xlint:all -Werror so generated warning regressions cannot be hidden by
      # handwritten warning debt.
      - name: Generate, lint, build, and test
        shell: bash
        run: >-
          ./gradlew lintGeneratedProtocolJava jar test
          --tests emu.grasscutter.net.ProtocolGenerationTest
          --build-cache
          -PskipHandbook=1
          -PjarFilename=grasscutter
          -PexcludeTags=integration
          -Dorg.gradle.jvmargs=-Xmx4g

      - name: Verify generated protocol set
        shell: bash
        run: |
          count="$(find build/generated/sources/protocol/7.1/java/main -name '*.java' -type f | wc -l)"
          test "$count" -eq 2059
          echo "Generated $count protocol Java files."
          sha256sum protocol/7.1/protocol.desc

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-test-results-${{ matrix.os }}
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-grasscutter-${{ matrix.os }}
          path: grasscutter.jar
          retention-days: 14
