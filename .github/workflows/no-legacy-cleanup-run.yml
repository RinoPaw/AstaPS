name: No legacy cleanup run

on:
  push:
    branches:
      - maintenance/no-legacy-cleanup-run

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/no-legacy-fallback
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply no-legacy cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          db_path = Path('src/main/java/emu/grasscutter/database/DatabaseHelper.java')
          db = db_path.read_text()
          db = replace_once(db, 'import at.favre.lib.crypto.bcrypt.BCrypt;\n', '', 'DatabaseHelper BCrypt import')

          legacy_ip = '''    /**
           * The prefix used before the ban reason was in English.
           *
           * <p>Accounts banned back then carry it and have no bannedByIp field, so unbanning an IP still
           * matches on it to find them. Nothing writes it any more.
           */
          private static final String LEGACY_IP_BAN_REASON_PREFIX = "IP\\u5df2\\u5c01\\u7981: ";

          '''
          db = replace_once(db, legacy_ip, '', 'legacy IP-ban prefix')

          old_ip_lookup = '''    /**
           * Every account that was banned because of this IP.
           *
           * <p>Matched on the bannedByIp field, with the old reason-text pattern as a fallback so
           * accounts banned before that field existed are still found.
           */
          public static List<Account> getAccountsBannedByIp(String ip) {
              if (ip == null) return List.of();
              return DatabaseManager.getAccountDatastore()
                      .find(Account.class)
                      .filter(
                              Filters.or(
                                      Filters.eq("bannedByIp", ip),
                                      Filters.regex("banReason")
                                              .pattern(
                                                      "^"
                                                              + java.util.regex.Pattern.quote(
                                                                      LEGACY_IP_BAN_REASON_PREFIX + ip))))
                      .iterator()
                      .toList();
          }
          '''
          new_ip_lookup = '''    /** Every account that was banned because of this IP. */
          public static List<Account> getAccountsBannedByIp(String ip) {
              if (ip == null) return List.of();
              return DatabaseManager.getAccountDatastore()
                      .find(Account.class)
                      .filter(Filters.eq("bannedByIp", ip))
                      .iterator()
                      .toList();
          }
          '''
          db = replace_once(db, old_ip_lookup, new_ip_lookup, 'legacy IP-ban lookup')

          old_account_api = '''    /**
           * Creates an account with a hashed password and an email address.
           *
           * <p>Separate from the two-argument version, which stores whatever it is handed verbatim.
           * Account.verifyPassword accepts both a BCrypt hash and a legacy plaintext value, so a password
           * stored raw does work - it just stays raw forever, since the authenticator only upgrades an
           * account whose stored password is empty.
           *
           * @return the new account, or null if the username is taken.
           */
          public static Account createAccountWithHashedPassword(
                  String username, String password, String email) {
              if (DatabaseHelper.getAccountByName(username) != null) return null;

              var account = new Account();
              account.setId(Integer.toString(DatabaseManager.getNextId(account)));
              account.setUsername(username);
              account.setPassword(BCrypt.withDefaults().hashToString(12, password.toCharArray()));
              if (email != null && !email.isBlank()) account.setEmail(email);
              DatabaseHelper.saveAccount(account);
              return account;
          }

          public static Account createAccountWithPassword(String username, String password) {
              // Unique names only
              Account exists = DatabaseHelper.getAccountByName(username);
              if (exists != null) {
                  return null;
              }

              // Account
              Account account = new Account();
              account.setId(Integer.toString(DatabaseManager.getNextId(account)));
              account.setUsername(username);
              account.setPassword(password);
              DatabaseHelper.saveAccount(account);
              return account;
          }
          '''
          new_account_api = '''    /** Creates an account with a password and optional email address. */
          public static Account createAccountWithPassword(
                  String username, String password, String email) {
              if (DatabaseHelper.getAccountByName(username) != null) return null;

              var account = new Account();
              account.setId(Integer.toString(DatabaseManager.getNextId(account)));
              account.setUsername(username);
              account.setPassword(password);
              if (email != null && !email.isBlank()) account.setEmail(email);
              DatabaseHelper.saveAccount(account);
              return account;
          }

          public static Account createAccountWithPassword(String username, String password) {
              return createAccountWithPassword(username, password, null);
          }
          '''
          db = replace_once(db, old_account_api, new_account_api, 'account password API')
          if 'LEGACY_IP_BAN_REASON_PREFIX' in db or 'createAccountWithHashedPassword' in db or 'BCrypt.' in db:
              raise SystemExit('DatabaseHelper still contains retired compatibility/password paths')
          db_path.write_text(db)

          auth_path = Path('src/main/java/emu/grasscutter/auth/DefaultAuthenticators.java')
          auth = auth_path.read_text()
          auth = auth.replace('DatabaseHelper.createAccountWithHashedPassword(', 'DatabaseHelper.createAccountWithPassword(')

          old_first_login = '''                        try {
                              account.setPassword(
                                      BCrypt.withDefaults().hashToString(10, rawPassword.toCharArray()));
                              account.save();
                          } catch (IllegalArgumentException tooLong) {
          '''
          new_first_login = '''                        try {
                              account.setPassword(rawPassword);
                              account.save();
                          } catch (IllegalArgumentException tooLong) {
          '''
          auth = replace_once(auth, old_first_login, new_first_login, 'standard first-login password')

          old_experimental_create = '''                    account = DatabaseHelper.createAccountWithUid(requestData.account, 0);
                          account.setPassword(
                                  BCrypt.withDefaults().hashToString(12, decryptedPassword.toCharArray()));
                          account.save();
          '''
          new_experimental_create = '''                    account =
                                  DatabaseHelper.createAccountWithPassword(
                                          requestData.account, decryptedPassword);
          '''
          auth = replace_once(auth, old_experimental_create, new_experimental_create, 'experimental account creation')

          old_experimental_verify = '''                    if (BCrypt.verifyer()
                                  .verify(decryptedPassword.toCharArray(), account.getPassword())
                                  .verified) {
          '''
          new_experimental_verify = '''                    if (verifyPassword(account, decryptedPassword)) {
          '''
          auth = replace_once(auth, old_experimental_verify, new_experimental_verify, 'experimental password verification')

          old_experimental_lock = '''                        account.setPassword(
                                  BCrypt.withDefaults()
                                          .hashToString(12, decryptedPassword.toCharArray()));
          '''
          new_experimental_lock = '''                        account.setPassword(decryptedPassword);
          '''
          auth = replace_once(auth, old_experimental_lock, new_experimental_lock, 'experimental first-login password')

          if 'BCrypt.' in auth:
              raise SystemExit('DefaultAuthenticators still hashes/verifies BCrypt directly')
          auth = replace_once(auth, 'import at.favre.lib.crypto.bcrypt.BCrypt;\n', '', 'DefaultAuthenticators BCrypt import')
          auth_path.write_text(auth)

          config_path = Path('src/main/java/emu/grasscutter/config/ConfigContainer.java')
          config = config_path.read_text()
          start = config.index('    /**\n     * Folds any pools the running config already names into the current default set.')
          end = config.index('    public Structure folderStructure = new Structure();', start)
          config = config[:start] + config[end:]
          config = replace_once(config, 'import com.google.gson.JsonObject;\n', '', 'ConfigContainer JsonObject import')
          config = replace_once(config, 'import emu.grasscutter.Grasscutter;\n', '', 'ConfigContainer Grasscutter import')
          if 'updateConfig()' in config or 'mergeThreadPoolDefaults' in config:
              raise SystemExit('ConfigContainer still contains config migration code')
          config_path.write_text(config)

          grass_path = Path('src/main/java/emu/grasscutter/Grasscutter.java')
          grass = grass_path.read_text()
          grass = replace_once(
              grass,
              '        // Attempt to update configuration.\n        ConfigContainer.updateConfig();\n\n',
              '',
              'Grasscutter config migration call')
          grass_path.write_text(grass)

      - name: Format
        run: ./gradlew spotlessApply -PskipHandbook=1

      - name: Verify diff
        run: |
          git diff --check
          ! grep -R "createAccountWithHashedPassword\|LEGACY_IP_BAN_REASON_PREFIX\|ConfigContainer.updateConfig" -n src/main/java

      - name: Build and test
        run: ./gradlew clean jar test -PskipHandbook=1

      - name: Commit cleanup
        run: |
          git config user.name "Rino"
          git config user.email "71957726+RinoPaw@users.noreply.github.com"
          git add src/main/java/emu/grasscutter/database/DatabaseHelper.java \
                  src/main/java/emu/grasscutter/auth/DefaultAuthenticators.java \
                  src/main/java/emu/grasscutter/config/ConfigContainer.java \
                  src/main/java/emu/grasscutter/Grasscutter.java
          git commit -m "refactor: enforce current account and config formats"
          git push origin HEAD:experiment/no-legacy-fallback
