# Chest loot and world Boss gems.
# Artifact and weekly-Boss pools are intentionally absent.

weapons_1_star: &weapons_1_star
  - {reward: genshin.weapon.dull_blade, weight: 1}
  - {reward: genshin.weapon.waster_greatsword, weight: 1}
  - {reward: genshin.weapon.beginners_protector, weight: 1}
  - {reward: genshin.weapon.apprentices_notes, weight: 1}
  - {reward: genshin.weapon.hunters_bow, weight: 1}

weapons_2_star: &weapons_2_star
  - {reward: genshin.weapon.silver_sword, weight: 1}
  - {reward: genshin.weapon.old_mercs_pal, weight: 1}
  - {reward: genshin.weapon.iron_point, weight: 1}
  - {reward: genshin.weapon.pocket_grimoire, weight: 1}
  - {reward: genshin.weapon.seasoned_hunters_bow, weight: 1}

weapons_3_star: &weapons_3_star
  - {reward: genshin.weapon.travelers_handy_sword, weight: 1}
  - {reward: genshin.weapon.ferrous_shadow, weight: 1}
  - {reward: genshin.weapon.recurve_bow, weight: 1}
  - {reward: genshin.weapon.otherworldly_story, weight: 1}
  - {reward: genshin.weapon.messenger, weight: 1}

# Mixed weapon pools; low/medium/high indicate increasing chances of higher-star weapons.
weapons_1_to_2_low: &weapons_1_to_2_low
  - {reward: *weapons_1_star, weight: 4}
  - {reward: *weapons_2_star, weight: 1}

weapons_1_to_2_medium: &weapons_1_to_2_medium
  - {reward: *weapons_1_star, weight: 1}
  - {reward: *weapons_2_star, weight: 1}

weapons_2_to_3_low: &weapons_2_to_3_low
  - {reward: *weapons_2_star, weight: 3}
  - {reward: *weapons_3_star, weight: 2}

weapons_2_to_3_high: &weapons_2_to_3_high
  - {reward: *weapons_2_star, weight: 1}
  - {reward: *weapons_3_star, weight: 3}

# Food ingredients.
meat_ingredients: &meat_ingredients
  - {reward: genshin.material.raw_meat, weight: 1}
  - {reward: genshin.material.fowl, weight: 1}

# Talent books by region and grade.
mondstadt_talent_teachings: &mondstadt_talent_teachings
  - {reward: genshin.talent_up.freedom, properties: {rarity: 2}, weight: 1}
  - {reward: genshin.talent_up.resistance, properties: {rarity: 2}, weight: 1}
  - {reward: genshin.talent_up.ballad, properties: {rarity: 2}, weight: 1}

mondstadt_talent_guides: &mondstadt_talent_guides
  - {reward: genshin.talent_up.freedom, properties: {rarity: 3}, weight: 1}
  - {reward: genshin.talent_up.resistance, properties: {rarity: 3}, weight: 1}
  - {reward: genshin.talent_up.ballad, properties: {rarity: 3}, weight: 1}

