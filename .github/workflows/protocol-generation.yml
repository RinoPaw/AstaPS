name: Protocol generation

on:
  push:
    branches:
      - "**"
    paths:
      - "protocol/**"
      - "tools/protocol/**"
      - "gradle/protocol-generation.gradle"
      - "build.gradle"
      - "src/test/java/emu/grasscutter/net/ProtocolGenerationTest.java"
      - ".github/workflows/protocol-generation.yml"
  workflow_dispatch:

concurrency:
  group: protocol-generation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Generate, build, and test (${{ runner.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The repository-wide test suite has a known unrelated worker-exit failure. This gate still
      # compiles the full production jar, then runs the regression test that exercises generated
      # descriptors and protobuf serialization against the pinned runtime.
      - name: Generate, build, and test
        shell: bash
        env:
          JDK_JAVAC_OPTIONS: -Xlint:all
        run: |
          set -o pipefail
          ./gradlew generateProtocolJava jar test \
            --tests emu.grasscutter.net.ProtocolGenerationTest \
            --build-cache \
            -PskipHandbook=1 \
            -PjarFilename=grasscutter \
            -PexcludeTags=integration \
            -Dorg.gradle.jvmargs=-Xmx4g \
            2>&1 | tee protocol-build.log

      - name: Verify generated protocol set
        shell: bash
        run: |
          count="$(find build/generated/sources/protocol/7.1/java/main -name '*.java' -type f | wc -l)"
          test "$count" -eq 2059
          echo "Generated $count protocol Java files."
          sha256sum protocol/7.1/protocol.desc

          if grep -E 'build[/\\]generated[/\\]sources[/\\]protocol[/\\].*: warning:' protocol-build.log; then
            echo "Generated protocol sources emitted javac warnings." >&2
            exit 1
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-test-results-${{ runner.os }}
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-grasscutter-${{ runner.os }}
          path: grasscutter.jar
          retention-days: 14
