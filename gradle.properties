# Local development performance defaults.
# Keep Gradle warm between edit/build cycles and reuse compiled outputs across branch switches.
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

# The Java compiler itself is forked with a larger heap in build.gradle because the checked-in
# protocol dump contains thousands of generated classes. This heap is for Gradle's own daemon.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
