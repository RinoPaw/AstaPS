# Authoritative bundled reward definitions. CSS selects these tables at runtime.
# Tables contain only item rolls; selection by chest kind, level or area stays in rewards.css.
# Missing count means one item (or one execution of a nested pool).
# Weight is a ratio within one weighted list: 3 and 1 give a 75% / 25% choice.
# Omitted weight runs every entry; mixing weighted and unweighted entries is invalid.
# count: "0.5" rolls once with 50% probability; count: "2.25" rolls 2 or 3.
# A count on a nested pool repeats the whole pool; count: 1 is always omitted.

# Four current approximate chest presets and their six named level aliases.
common_chest: &common_chest_items
  - {reward: genshin.item.mora, count: "257~996"}
  - {reward: genshin.item.enhancement_ore, count: "1~3"}
  - reward:
      - {reward: genshin.item.wanderers_advice, count: "1~2", weight: 3}
      - {reward: genshin.item.adventurers_experience, weight: 1}

common_chest_light: *common_chest_items
common_chest_low: *common_chest_items
common_chest_medium: *common_chest_items
common_chest_high: *common_chest_items
common_chest_xhigh: *common_chest_items
common_chest_max: *common_chest_items

exquisite_chest: &exquisite_chest_items
  - {reward: genshin.item.mora, count: "756~1367"}
  - reward:
      - {reward: genshin.item.enhancement_ore, count: "2~4", weight: 2}
      - {reward: genshin.item.fine_enhancement_ore, count: "1~2", weight: 1}
  - reward:
      - {reward: genshin.item.wanderers_advice, count: "2~3", weight: 2}
      - {reward: genshin.item.adventurers_experience, count: "1~2", weight: 3}

exquisite_chest_light: *exquisite_chest_items
exquisite_chest_low: *exquisite_chest_items
exquisite_chest_medium: *exquisite_chest_items
exquisite_chest_high: *exquisite_chest_items
exquisite_chest_xhigh: *exquisite_chest_items
exquisite_chest_max: *exquisite_chest_items

precious_chest: &precious_chest_items
  - {reward: genshin.item.mora, count: 1433}
  - {reward: genshin.item.fine_enhancement_ore, count: "1~3"}
  - reward:
      - {reward: genshin.item.adventurers_experience, count: "1~3", weight: 3}
      - {reward: genshin.item.heros_wit, weight: 1}

precious_chest_light: *precious_chest_items
precious_chest_low: *precious_chest_items
precious_chest_medium: *precious_chest_items
precious_chest_high: *precious_chest_items
precious_chest_xhigh: *precious_chest_items
precious_chest_max: *precious_chest_items

luxurious_chest: &luxurious_chest_items
  - {reward: genshin.item.mora, count: "2000~3000"}
  - {reward: genshin.item.fine_enhancement_ore, count: "2~4"}
  - reward:
      - {reward: genshin.item.adventurers_experience, count: "2~3", weight: 2}
      - {reward: genshin.item.heros_wit, count: "1~2", weight: 3}

luxurious_chest_light: *luxurious_chest_items
luxurious_chest_low: *luxurious_chest_items
luxurious_chest_medium: *luxurious_chest_items
luxurious_chest_high: *luxurious_chest_items
luxurious_chest_xhigh: *luxurious_chest_items
luxurious_chest_max: *luxurious_chest_items

# First activation in the Three Realms Gateway Offering scene.
three_realms_point:
  - {reward: genshin.item.id_101692, count: 20}

# Archived historical chest drop tables: available to invoke by qualified table ID,
# but NOT selected by the unchanged rewards.css default rules.
# Original datasets: AstaPS-Resource/Server/DropTableExcelConfigData.json and
# Server/DropSubTableExcelConfigData.json (sourceType=19).
# 108 independent root tables + 571 dependencies; 1,843 positive-weight entries.
# 510/513 families: combat; 520/523: puzzle; 530/540/550: other source families.
# These historical contents have not been independently confirmed for Genshin 7.1.
# Each table key chest_drop_<ID> is registered as astaps.loot.chest_drop_<ID>.
# YAML anchors link child pools; no region, enemy, puzzle or level selection lives here.
# In the original data randomType=0 selects a weighted entry; randomType=1
# rolls independent entries. Small decimal counts encode independent chances.
# Known item names use genshin.item.<name>; less certain identities use
# genshin.item.id_<numeric ID>, an exact source-backed fallback when no
# verified semantic name exists. These aliases make no cross-version guarantee.
# All 187 distinct numeric fallbacks were found in the archived item Excel data.
# Relative weights below are reduced, without changing their probabilities.

