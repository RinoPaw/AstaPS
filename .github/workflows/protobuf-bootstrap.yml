name: Verify 7.1 protobuf generation

on:
  push:
    branches:
      - fix/protobuf-generation-7.1
    paths:
      - "protocol/7.1/**"
      - "tools/protocol/**"
      - "gradle/protocol-generation.gradle"
      - ".github/workflows/protobuf-bootstrap.yml"
  workflow_dispatch:

concurrency:
  group: protobuf-generation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Regenerate and compile protocol
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Java from canonical descriptor set
        run: >-
          ./gradlew -I gradle/protocol-generation.gradle generateProtocolJava
          --build-cache
          -PskipHandbook=1
          -Dorg.gradle.jvmargs=-Xmx6g

      - name: Compile against regenerated protocol sources
        run: >-
          ./gradlew -I gradle/protocol-generation.gradle compileJava
          --build-cache
          -PskipHandbook=1
          -Dorg.gradle.jvmargs=-Xmx6g

      - name: Inspect generated sources and protobuf runtime
        shell: bash
        run: |
          find build/generated/sources/protocol/7.1/java/main -name '*.java' -type f | wc -l
          sha256sum protocol/7.1/protocol.desc
          ./gradlew dependencyInsight \
            --dependency protobuf-java \
            --configuration compileClasspath \
            -q

      - name: Enable descriptor-based generation in normal builds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

          if ! grep -Fq "apply from: 'gradle/protocol-generation.gradle'" build.gradle; then
            printf "\napply from: 'gradle/protocol-generation.gradle'\n" >> build.gradle
          fi

          git add build.gradle
          if git diff --cached --quiet; then
            echo "Descriptor-based generation is already enabled."
            exit 0
          fi

          git commit -m "build: generate 7.1 protocol Java from descriptors"
          git push origin "HEAD:${GITHUB_REF_NAME}"
