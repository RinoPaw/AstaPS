syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "ItemParam.proto";

// CN 7.2 dump (CmdID 1150). Field numbers verified against MeChen618 capture.
message CombineRsp {
  uint64 avatar_guid = 1;
  int32 retcode = 2;
  repeated ItemParam total_random_item_list = 3;
  repeated ItemParam total_return_item_list = 5;
  repeated ItemParam result_item_list = 6;
  uint32 combine_id = 8;
  repeated ItemParam cost_item_list = 9;
  repeated ItemParam total_extra_item_list = 11;
  // Still obfuscated in the dump; leave unused until named.
  repeated ItemParam HJDJPJMDHNK = 12;
  uint32 combine_count = 14;
}
