syntax = "proto3";
option java_package = "emu.grasscutter.net.proto";

import "GameplayRecommendationElementReliquaryRequest.proto";
import "GameplayRecommendationReliquaryRequest.proto";
import "GameplayRecommendationSkillRequest.proto";
import "_GameplayRecommendationElementReliquarySetRequest.proto";
import "_GameplayRecommendationElementWeaponRequest.proto";
import "_GameplayRecommendationReliquarySetRequest.proto";
import "_GameplayRecommendationWeaponRequest.proto";

message GetGameplayRecommendationReq {
  uint32 type = 6;
  uint32 avatar_id = 11;
  oneof detail {
    GameplayRecommendationElementReliquaryRequest ElementReliquaryRequest = 776;
    _GameplayRecommendationReliquarySetRequest ReliquarySetRequest = 802;
    _GameplayRecommendationElementWeaponRequest ElementWeaponRequest = 989;
    GameplayRecommendationSkillRequest SkillRequest = 1304;
    GameplayRecommendationReliquaryRequest ReliquaryRequest = 1529;
    _GameplayRecommendationWeaponRequest WeaponRequest = 1901;
    _GameplayRecommendationElementReliquarySetRequest ElementReliquarySetRequest = 1929;
  }
}
