# Reward candidate pools used by rewards.css.
# Entries select items and properties; CSS controls when and how often pools run.
#
# Known limitations (details and authoritative notes in rewards.css):
# - Clockwork Mek artifacts reuse Pyro Regisvine pools.
# - Some regional puzzle-chest pools fall back to combat-chest sources.
# - Native regional Mora, EXP, and talent-book data covers cities 1-4 only.
# - Some chest weapon/ore pools remain legacy; weekly Boss rewards are not included.
# - Boss probabilities include integer approximations; names and payouts need validation.
#
# Contents
# 1. Chest pools: weapons, ingredients, talent books, artifacts
# 2. World Boss artifacts
# 3. World Boss ascension gems

# =============================================================================
# 1. Chest candidate pools
# =============================================================================

## 1.1 Weapons
# Individual star tiers use equal candidate weights.
weapons_1_star: &weapons_1_star
  - {reward: genshin.weapon.dull_blade, weight: 1}
  - {reward: genshin.weapon.waster_greatsword, weight: 1}
  - {reward: genshin.weapon.beginners_protector, weight: 1}
  - {reward: genshin.weapon.apprentices_notes, weight: 1}
  - {reward: genshin.weapon.hunters_bow, weight: 1}

weapons_2_star: &weapons_2_star
  - {reward: genshin.weapon.silver_sword, weight: 1}
  - {reward: genshin.weapon.old_mercs_pal, weight: 1}
  - {reward: genshin.weapon.iron_point, weight: 1}
  - {reward: genshin.weapon.pocket_grimoire, weight: 1}
  - {reward: genshin.weapon.seasoned_hunters_bow, weight: 1}

weapons_3_star: &weapons_3_star
  - {reward: genshin.weapon.travelers_handy_sword, weight: 1}
  - {reward: genshin.weapon.ferrous_shadow, weight: 1}
  - {reward: genshin.weapon.recurve_bow, weight: 1}
  - {reward: genshin.weapon.otherworldly_story, weight: 1}
  - {reward: genshin.weapon.messenger, weight: 1}

# Mixed weapon tiers. Low/medium/high indicate the relative higher-rarity chance.
weapons_1_to_2_low: &weapons_1_to_2_low
  - {reward: *weapons_1_star, weight: 4}
  - {reward: *weapons_2_star, weight: 1}

weapons_1_to_2_medium: &weapons_1_to_2_medium
  - {reward: *weapons_1_star, weight: 1}
  - {reward: *weapons_2_star, weight: 1}

weapons_2_to_3_low: &weapons_2_to_3_low
  - {reward: *weapons_2_star, weight: 3}
  - {reward: *weapons_3_star, weight: 2}

weapons_2_to_3_high: &weapons_2_to_3_high
  - {reward: *weapons_2_star, weight: 1}
  - {reward: *weapons_3_star, weight: 3}

## 1.2 Food ingredients
meat_ingredients: &meat_ingredients
  - {reward: genshin.material.raw_meat, weight: 1}
  - {reward: genshin.material.fowl, weight: 1}

## 1.3 Regional talent books
# Three equal-weight candidates per roll; CSS specifies each region's families and rarity.
regional_talent_books<set1, set2, set3, rarity>:
  - {reward: genshin.talent_up.<set1>, properties: {rarity: <rarity>}, weight: 1}
  - {reward: genshin.talent_up.<set2>, properties: {rarity: <rarity>}, weight: 1}
  - {reward: genshin.talent_up.<set3>, properties: {rarity: <rarity>}, weight: 1}

## 1.4 Native chest artifacts (sourceType 19, cities 1-4)
# Parameterized candidate sets preserve native rarity and initial substat counts.
# Slot 1~5 selects uniformly; each mixture retains its source relative weights.

chest_artifact_pair<set1, set2, rarity, substats>:
  - {reward: "genshin.artifact.<set1>", properties: {slot: "1~5", rarity: <rarity>, substats: <substats>}, weight: 1000}
  - {reward: "genshin.artifact.<set2>", properties: {slot: "1~5", rarity: <rarity>, substats: <substats>}, weight: 1000}

chest_artifact_quad<set1, set2, set3, set4, rarity, substats>:
  - {reward: "genshin.artifact.<set1>", properties: {slot: "1~5", rarity: <rarity>, substats: <substats>}, weight: 1000}
  - {reward: "genshin.artifact.<set2>", properties: {slot: "1~5", rarity: <rarity>, substats: <substats>}, weight: 1000}
  - {reward: "genshin.artifact.<set3>", properties: {slot: "1~5", rarity: <rarity>, substats: <substats>}, weight: 1000}
  - {reward: "genshin.artifact.<set4>", properties: {slot: "1~5", rarity: <rarity>, substats: <substats>}, weight: 1000}

