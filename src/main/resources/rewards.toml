# AstaPS server-owned reward configuration. Generated once, then operator-owned.
# Direct reward tables only. Chest selectors are parsed but not yet connected to runtime.
# Trans-point selectors: "kind=waypoint", "kind=statue", "kind=domain", "7:*", "3:6".
# Priority: exact point > scene > kind. Every table replaces the entire reward.
version = 1

[transPoint."kind=waypoint"]
adventureExp = 50
primogems = 5

[transPoint."kind=statue"]
adventureExp = 50
primogems = 5

# Awarded on first manual activation of a dungeon entrance, not on entering it.
[transPoint."kind=domain"]
adventureExp = 50
primogems = 5

# The tutorial waypoint's native first-unlock reward has no primogems.
[transPoint."3:6"]
adventureExp = 10

# Three Realms Gateway Offering (scene 7).
[transPoint."7:*"]
primogems = 5
items = [{ id = 101692, count = 20 }]

# Ordinary exploration chest baseline, for regions using the higher gem tier.
# The 7.1 game has five chest families. All five award 30 Adventure EXP.
# Standard Mondstadt/Liyue regions and Tsurumi have different Primogem values.
# Shrine, Primal Obelisk, event, and special quest chests have separate rewards.
# Do not apply these values to those exceptions until classified accurately.
[chest."kind=common"]
adventureExp = 30
primogems = 2

[chest."kind=exquisite"]
adventureExp = 30
primogems = 5

[chest."kind=precious"]
adventureExp = 30
primogems = 10

[chest."kind=luxurious"]
adventureExp = 30
primogems = 10

# Furniture blueprints are chest-specific and remain native data.
[chest."kind=remarkable"]
adventureExp = 30
primogems = 5
