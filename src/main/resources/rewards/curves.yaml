# Early world-Boss gem profiles: ChestDrop.json (sourceType=34), Lv.1-29.
# 48 native Boss identities x 6 level brackets = 288 source roots.
# 15 Bosses have no gem entries; do not award an artificial zero-count item.
# 15 single-element Bosses use the direct item-count curve below.
# 9 dual-element Bosses use the same source curve as independent pool rolls:
# each weighted choice awards 3 gems of the selected element.
# Setekh Wenut has 3x the standard per-item quantity (9 gems per roll).
# 2 / 5 / 1 Bosses grant fixed totals of 18 / 36 / 54 gems, respectively;
# the native roots contain 2 / 4 / 6 distinct gem items, each with count 9.
# The fixed-total groups must retain their separate item identities in CSS;
# NEVER apply the aggregate totals as a count for one item or one pool.
# Values preserve native countRange (1.47246, 1.57179, 1.69587,
# 1.81995, 1.94403, 2.06811), expressed as integer bonus rolls.
