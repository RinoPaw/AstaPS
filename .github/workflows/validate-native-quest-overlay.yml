name: Validate native Quest overlay

on:
  push:
    branches:
      - rino-native-mainline-quests
    paths:
      - .github/workflows/validate-native-quest-overlay.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare test resource layout
        run: mkdir -p resources/BinOutput resources/ExcelBinOutput
      - name: Build and test
        run: ./gradlew clean jar test --no-build-cache --warning-mode all -PskipHandbook=1 -Dorg.gradle.jvmargs=-Xmx4g
      - name: Verify 7.1 artifact
        run: test -f grasscutter-7.1.0.jar
