# Variable item rewards only. CSS owns currencies and Adventure EXP.
# Battle EXP/books and puzzle weapons/ore are combined in these twelve tiers.
# Weapons are provisional; ore counts/chances use verified native Mondstadt puzzle roots.
# Reusable pools are organized by item type, not chest grade or level.

# Weapon candidates by star rarity.
weapons_1_star: &weapons_1_star
  - {reward: genshin.weapon.dull_blade, weight: 1}
  - {reward: genshin.weapon.waster_greatsword, weight: 1}
  - {reward: genshin.weapon.beginners_protector, weight: 1}
  - {reward: genshin.weapon.apprentices_notes, weight: 1}
  - {reward: genshin.weapon.hunters_bow, weight: 1}

weapons_2_star: &weapons_2_star
