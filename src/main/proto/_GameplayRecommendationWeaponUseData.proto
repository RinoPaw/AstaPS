syntax = "proto3";
option java_package = "emu.grasscutter.net.proto";

import "_GameplayRecommendationWeaponSourceType.proto";
import "_GameplayRecommendationWeaponUsageRate.proto";

message _GameplayRecommendationWeaponUseData {
  _GameplayRecommendationWeaponSourceType.Value source = 11;
  _GameplayRecommendationWeaponUsageRate.Value _usage_rate = 13;
  uint32 _use_weapon_id = 15;
}
