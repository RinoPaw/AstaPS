plugins {
    id 'java' // Apply the java plugin to add support for Java
    id 'java-library' // Apply the java-library plugin for API and implementation separation.
    id 'application' // Apply the application plugin to add support for building a CLI application
    id 'com.diffplug.spotless' version '8.10.3' // Apply the Spotless linter plugin.

    id 'eclipse' // Eclipse Support
    id 'idea' // IntelliJ Support

    id 'maven-publish' // Support for publishing to Maven repositories.
    id 'signing' // Support for signing build artifacts.

    id 'io.freefair.lombok' version '9.7.0' // Lombok for delombok'ification
}

spotless {
    java {
        target fileTree(rootDir) {
            include '**/*.java'
            exclude '**/generated/**/*.*'
            exclude '.idea/**/*.*'
        }

        importOrder('io.grasscutter', '', 'java', 'javax', '\\#java', '\\#') // Configure import order.
        googleJavaFormat('1.15.0') // Use Google's Java formatter.
        formatAnnotations() // Reformat annotations.
        endWithNewline() // Ensure files end with a newline.
        indentWithTabs(2); indentWithSpaces(4) // Use 4 spaces for indentation.
        toggleOffOn() // Toggle off/on.
    }
}

compileJava {
	options.encoding = "UTF-8"
	options.fork = 'true'
	options.forkOptions.with {
		// ~5,500 generated protocol classes; with 3000m javac stalls in GC.
		memoryMaximumSize = "6g"
	}
}

compileTestJava.options.encoding = 'UTF-8'

group = 'io.grasscutter'
version = '7.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.release.set(21)
}

repositories {
    mavenCentral()
}

dependencies {
    // Additional JAR libraries.
    implementation fileTree(dir: 'lib', include: ['*.jar'])

    implementation 'it.unimi.dsi:fastutil:8.5.8'

    // Logging libraries.
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-core:1.4.7'
    implementation 'ch.qos.logback:logback-classic:1.4.7'

    // Line reading libraries.
    implementation 'org.jline:jline:3.21.0'
    implementation 'org.jline:jline-terminal-jna:3.21.0'
    implementation 'net.java.dev.jna:jna:5.10.0'

    // Java Netty for networking.
    implementation 'io.netty:netty-common:4.1.86.Final'
    implementation 'io.netty:netty-handler:4.1.86.Final'
    implementation 'io.netty:netty-transport-native-epoll:4.1.86.Final'
    implementation 'io.netty:netty-transport-native-kqueue:4.1.86.Final'

    // Serialization.
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.google.protobuf:protobuf-java:3.19.6'
    implementation 'com.github.os72:protobuf-dynamic:1.0.1'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.2'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.14.0')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.2'

    // Reflections libraries.
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'com.esotericsoftware:reflectasm:1.11.9'
    implementation 'com.github.davidmoten:rtree-multi:0.1'

    // MongoDB object mapper.
    implementation 'dev.morphia.morphia:morphia-core:2.2.7'

    // Utility libraries.
    implementation 'org.greenrobot:eventbus-java:3.3.1'
    // implementation 'org.danilopianini:java-quadtree:0.1.9'

    // Long-term scheduler.
    implementation 'org.quartz-scheduler:quartz:2.3.2'
    implementation 'org.quartz-scheduler:quartz-jobs:2.3.2'

    // Lua script engine library.
    implementation 'org.luaj:luaj-jse:3.0.1'

    // Java HTTP server library.
    implementation 'io.javalin:javalin:5.5.0'
    // Java WebSocket server & client library.
    implementation 'org.java-websocket:Java-WebSocket:1.5.2'
    
    // Xxhash
    implementation 'net.openhft:zero-allocation-hashing:0.26ea0'

    // Testing libraries.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'

    // HTTP client library for testing.
    testImplementation 'com.squareup.okhttp3:okhttp:4.10.0'

    // Lombok.
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j'
}

application {
    // Define the main class for the application
    getMainClass().set('emu.grasscutter.Grasscutter')
}

jar {
    exclude '*.proto'

    manifest {
        attributes 'Main-Class': 'emu.grasscutter.Grasscutter'
    }

    archiveBaseName = 'grasscutter'
    if (project.hasProperty('jarFilename')) {
        // archiveExtension is a lazy Property, so interpolating it directly stringifies the
        // property itself and the jar lands under a filename containing its description.
        archiveFileName = "${jarFilename}.${archiveExtension.get()}"
    }

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from('src/main/java') {
        include '*.xml'
    }

    destinationDirectory = file('.')
}

test {
    useJUnitPlatform {
        // GrasscutterTest boots a real server, so it needs MongoDB and the resources pack, which
        // is gitignored. A fresh checkout cannot run it. Tagging lets CI ask for the tests that
        // stand on their own (-PexcludeTags=integration) while a plain `gradlew test` still runs
        // everything for anyone who has a working server checkout.
        if (project.hasProperty('excludeTags')) {
            excludeTags project.property('excludeTags').split(',')
        }
    }
    setMaxHeapSize('4G')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'grasscutter'
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

            pom {
                name = 'Grasscutter'
                description = 'A server software reimplementation for an anime game.'
                url = 'https://github.com/Grasscutters/Grasscutter'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'meledy'
                        name = 'Meledy'
                        email = 'meledy@grasscutter.io' // not a real email kek
                    }
                }
                scm {
                    connection = 'scm:git:git@github.com:Grasscutters/Grasscutter.git'
                    developerConnection = 'scm:git:ssh://github.com:Grasscutters/Grasscutter.git'
                    url = 'https://github.com/Grasscutters/Grasscutter'
                }
            }
        }
    }

    repositories {
        maven {
            if (version.endsWith('-dev')) {
                // Check if the action being ran is 'publish'.
                if (publish.state.executing) {
                    println('Publishing to Ben4J-Maven')
                }

                url 'https://repo.4benj.com/releases'
                name '4benj-maven'
                credentials {
                    username System.getenv('benj_maven_username')
                    password System.getenv('benj_maven_token')
                }
            } else {
                // Check if the action being ran is 'publish'.
                if (publish.state.executing) {
                    println('Publishing to Sonatype')
                }

                def releasesRepoUrl = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
                def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
                url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl

                name = 'sonatype'
                credentials(PasswordCredentials)
            }
        }
    }
}

def buildConfigOutputDir = layout.buildDirectory.dir('generated/sources/buildConfig/java/main')

sourceSets {
    main {
        // The 7.1 protocol dump is checked in as generated Java; there are no source .proto files.
        java {
            srcDir 'src/generated/main/java'
            srcDir buildConfigOutputDir
        }
    }
}

eclipse {
    classpath {
        file.whenMerged {
            cp -> cp.entries.add(new SourceFolder('src/generated/main/java', null))
        }
    }
}

signing {
    if (!version.endsWith('-dev')) {
        sign publishing.publications.mavenJava
    }
}

javadoc {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }

    // Add this to avoid warning caused by lack of comments in proto generated java files
    options.addStringOption('Xdoclint:none', '-quiet')
    exclude '**/*.md'
    exclude 'src/handbook/**/*.*'
    exclude 'src/generated/**/*.*'
}

def legacyBuildConfig = file('src/main/java/emu/grasscutter/BuildConfig.java')
def generatedBuildConfig = buildConfigOutputDir.map { it.file('emu/grasscutter/BuildConfig.java') }

tasks.register('generateBuildConfig') {
    group = 'build setup'
    description = 'Generate build version and Git hash metadata for the server.'
    outputs.file(generatedBuildConfig)

    doLast {
        // Older builds generated this file inside src/main/java and .gitignore hid it. Remove the
        // stale local artifact during migration so it cannot collide with the generated source.
        if (legacyBuildConfig.exists()) {
            delete legacyBuildConfig
        }

        def gitHash = 'GIT_NOT_FOUND'
        try {
            def process = new ProcessBuilder('git', 'rev-parse', '--verify', '--short', 'HEAD')
                    .directory(rootDir)
                    .redirectErrorStream(true)
                    .start()
            def output = process.inputStream.text.trim()
            if (process.waitFor() == 0 && !output.isEmpty()) {
                gitHash = output
            }
        } catch (IOException ignored) {
            // Source archives can build without a .git directory or git executable.
        }

        def outputFile = generatedBuildConfig.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = """package emu.grasscutter;

public final class BuildConfig {
    public static final String VERSION = \"${version}\";
    public static final String GIT_HASH = \"${gitHash}\";

    private BuildConfig() {}
}
"""
    }
}

tasks.named('compileJava') {
    dependsOn 'generateBuildConfig'
}

tasks.named('sourcesJar') {
    dependsOn 'generateBuildConfig'
}

def handbookDataFiles = [
    'src/handbook/data/commands.json',
    'src/handbook/data/avatars.csv',
    'src/handbook/data/entities.csv',
    'src/handbook/data/items.csv',
    'src/handbook/data/mainquests.csv',
    'src/handbook/data/quests.csv',
    'src/handbook/data/scenes.csv'
]
def handbookNpm = Os.isFamily(Os.FAMILY_WINDOWS) ? 'npm.cmd' : 'npm'

tasks.register('generateHandbook', Exec) {
    group = 'documentation'
    description = 'Install handbook dependencies when handbook source data is available.'
    workingDir 'src/handbook'
    commandLine handbookNpm, 'install'

    onlyIf {
        if (project.hasProperty('skipHandbook')) {
            logger.lifecycle('Skipping handbook generation.')
            return false
        }

        def missingData = handbookDataFiles.find { !file(it).exists() }
        if (missingData != null) {
            logger.lifecycle("${missingData} was not found. Skipping handbook generation.")
            return false
        }

        try {
            def process = new ProcessBuilder(handbookNpm, '--version')
                    .redirectErrorStream(true)
                    .start()
            process.inputStream.text
            if (process.waitFor() != 0) {
                logger.lifecycle('NPM is not available. Skipping handbook generation.')
                return false
            }
        } catch (IOException ignored) {
            logger.lifecycle('NPM is not installed. Skipping handbook generation.')
            return false
        }

        return true
    }
}

// For terminal interacting in IDEA running
run {
    standardInput = System.in
}
