import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id 'com.diffplug.spotless' version '8.10.3'

    id 'eclipse'
    id 'idea'

    id 'io.freefair.lombok' version '9.8.0'
}

spotless {
    java {
        target fileTree(rootDir) {
            include '**/*.java'
            exclude '**/generated/**/*.*'
            exclude '.idea/**/*.*'
        }

        importOrder('io.grasscutter', '', 'java', 'javax', '\\#java', '\\#')
        googleJavaFormat('1.17.0')
        formatAnnotations()
        endWithNewline()
        leadingSpacesToTabs(2); leadingTabsToSpaces(4)
        toggleOffOn()
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.with {
        // ~5,500 generated protocol classes; with 3000m javac stalls in GC.
        memoryMaximumSize = '6g'
    }
}

compileTestJava.options.encoding = 'UTF-8'

group = 'io.grasscutter'
version = '7.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.release.set(21)
}

repositories {
    mavenCentral()
}

dependencies {
    // KCP is a custom/unpublished build and remains vendored until its upstream is identified.
    implementation files('lib/kcp-1.5.1.jar')

    // These used to be checked-in JARs; use their published Maven Central artifacts instead.
    implementation 'at.favre.lib:bcrypt:0.8.0'
    implementation 'at.favre.lib:bytes:1.3.0'

    implementation 'it.unimi.dsi:fastutil:8.5.19'

    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation 'ch.qos.logback:logback-core:1.5.36'
    implementation 'ch.qos.logback:logback-classic:1.5.36'

    implementation 'org.jline:jline:3.30.7'
    implementation 'org.jline:jline-terminal-jna:3.30.7'
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'info.picocli:picocli-shell-jline3:4.7.7'
    implementation 'net.java.dev.jna:jna:5.19.1'

    implementation platform('io.netty:netty-bom:4.1.138.Final')
    implementation 'io.netty:netty-common'
    implementation 'io.netty:netty-handler'
    implementation 'io.netty:netty-transport-native-epoll'
    implementation 'io.netty:netty-transport-native-kqueue'

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.protobuf:protobuf-java:3.25.9'
    implementation 'com.github.os72:protobuf-dynamic:1.0.1'

    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.3')
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation 'org.reflections:reflections:0.10.2'
    implementation 'com.esotericsoftware:reflectasm:1.11.9'
    implementation 'com.github.davidmoten:rtree-multi:0.1'

    implementation 'dev.morphia.morphia:morphia-core:2.2.10'

    implementation 'org.greenrobot:eventbus-java:3.3.1'

    // Quartz 2.5 moves to Jakarta namespaces. Stay on the latest pre-migration line until
    // the scheduler integration is migrated deliberately.
    implementation 'org.quartz-scheduler:quartz:2.4.1'
    implementation 'org.quartz-scheduler:quartz-jobs:2.4.1'

    implementation 'org.luaj:luaj-jse:3.0.1'

    // Javalin 6+ changes the HTTP/Jetty integration API. Keep the latest 5.x until that
    // migration is handled separately.
    implementation 'io.javalin:javalin:5.6.5'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'

    implementation 'net.openhft:zero-allocation-hashing:0.26ea0'

    testImplementation platform('org.junit:junit-bom:5.14.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j'
}

application {
    mainClass.set('emu.grasscutter.Grasscutter')
}

jar {
    exclude '*.proto'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    manifest {
        attributes 'Main-Class': 'emu.grasscutter.Grasscutter'
    }

    archiveBaseName = 'grasscutter'
    if (project.hasProperty('jarFilename')) {
        archiveFileName = "${jarFilename}.${archiveExtension.get()}"
    }

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from('src/main/java') {
        include '*.xml'
    }

    destinationDirectory = file('.')
}

test {
    useJUnitPlatform {
        // GrasscutterTest boots a real server and needs MongoDB plus the resources pack.
        if (project.hasProperty('excludeTags')) {
            excludeTags project.property('excludeTags').split(',')
        }
    }
    setMaxHeapSize('4G')
}

def buildConfigOutputDir = layout.buildDirectory.dir('generated/sources/buildConfig/java/main')

sourceSets {
    main {
        java {
            srcDir buildConfigOutputDir
        }
    }
}

javadoc {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }

    options.addStringOption('Xdoclint:none', '-quiet')
    exclude '**/*.md'
    exclude 'src/handbook/**/*.*'
}

def legacyBuildConfig = file('src/main/java/emu/grasscutter/BuildConfig.java')
def generatedBuildConfig = buildConfigOutputDir.map { it.file('emu/grasscutter/BuildConfig.java') }

tasks.register('generateBuildConfig') {
    group = 'build setup'
    description = 'Generate build version and Git hash metadata for the server.'
    outputs.file(generatedBuildConfig)

    doLast {
        if (legacyBuildConfig.exists()) {
            delete legacyBuildConfig
        }

        def gitHash = 'GIT_NOT_FOUND'
        try {
            def process = new ProcessBuilder('git', 'rev-parse', '--verify', '--short', 'HEAD')
                    .directory(rootDir)
                    .redirectErrorStream(true)
                    .start()
            def output = process.inputStream.text.trim()
            if (process.waitFor() == 0 && !output.isEmpty()) {
                gitHash = output
            }
        } catch (IOException ignored) {
            // Source archives can build without a .git directory or git executable.
        }

        def outputFile = generatedBuildConfig.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = """package emu.grasscutter;

public final class BuildConfig {
    public static final String VERSION = \"${version}\";
    public static final String GIT_HASH = \"${gitHash}\";

    private BuildConfig() {}
}
"""
    }
}

tasks.named('compileJava') {
    dependsOn 'generateBuildConfig'
}

tasks.named('sourcesJar') {
    dependsOn 'generateBuildConfig'
}

def handbookDataFiles = [
    'src/handbook/data/commands.json',
    'src/handbook/data/avatars.csv',
    'src/handbook/data/entities.csv',
    'src/handbook/data/items.csv',
    'src/handbook/data/mainquests.csv',
    'src/handbook/data/quests.csv',
    'src/handbook/data/scenes.csv'
]
def handbookNpm = Os.isFamily(Os.FAMILY_WINDOWS) ? 'npm.cmd' : 'npm'

tasks.register('generateHandbook', Exec) {
    group = 'documentation'
    description = 'Install handbook dependencies when handbook source data is available.'
    workingDir 'src/handbook'
    commandLine handbookNpm, 'install'

    onlyIf {
        if (project.hasProperty('skipHandbook')) {
            logger.lifecycle('Skipping handbook generation.')
            return false
        }

        def missingData = handbookDataFiles.find { !file(it).exists() }
        if (missingData != null) {
            logger.lifecycle("${missingData} was not found. Skipping handbook generation.")
            return false
        }

        try {
            def process = new ProcessBuilder(handbookNpm, '--version')
                    .redirectErrorStream(true)
                    .start()
            process.inputStream.text
            if (process.waitFor() != 0) {
                logger.lifecycle('NPM is not available. Skipping handbook generation.')
                return false
            }
        } catch (IOException ignored) {
            logger.lifecycle('NPM is not installed. Skipping handbook generation.')
            return false
        }

        return true
    }
}

run {
    standardInput = System.in
}

apply from: 'gradle/protocol-generation.gradle'
