# World Boss gems: seven exact templates from the native ChestDrop / DropTable graph.
# Only item families are substituted. Quantities and normalized probabilities must match.
# Count distributions below are YAML percentages (sum 100), not CSS relative weights.
# A list-valued reward is rerolled once per outer execution; each selected batch stays together.
