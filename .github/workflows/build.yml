name: Build

on:
  # Every in-repo branch is covered here, and GitHub attaches these runs to any PR opened from one,
  # so a pull_request trigger would only build the same commit a second time.
  push:
    branches:
      - "**"
      # main is covered by the release workflow, which builds and tests the same way.
      - "!main"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".sdkmanrc"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # AstaPS uses Java 21 APIs such as virtual threads.
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Keep the formatter, jar, and standalone tests in one Gradle invocation. This avoids repeated
      # configuration/startup work while preserving the same validation boundary.
      - name: Verify build
        run: >-
          ./gradlew spotlessJavaCheck jar test --build-cache
          -PskipHandbook=1
          -PjarFilename=grasscutter
          -PexcludeTags=integration
          -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: grasscutter
          path: grasscutter.jar
          retention-days: 14
