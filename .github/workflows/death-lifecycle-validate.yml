name: Death lifecycle validation

on:
  push:
    branches:
      - "fix/death-lifecycle-7.1"
  workflow_dispatch:

concurrency:
  group: death-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Compile and test death lifecycle fix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The repository-wide Spotless gate currently reports pre-existing violations in hundreds
      # of untouched files. Keep this focused validation independent so the gameplay fix still
      # gets a real compile + unit-test gate before live testing.
      - name: Compile and test
        run: >-
          ./gradlew jar test --build-cache
          -PskipHandbook=1
          -PjarFilename=grasscutter-7.1.0
          -PexcludeTags=integration
          -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: death-lifecycle-test-results
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: grasscutter-7.1.0
          path: grasscutter-7.1.0.jar
          retention-days: 14
