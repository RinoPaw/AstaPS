# AstaPS unified fixed rewards. Generated once at ./rewards.toml.
# This file belongs to the server operator and is never overwritten on updates.
# Sections: transPoint = first unlock; chest = standard exploration chest fixed rewards.
# Rules match in TOML file order, top to bottom. A later matching value wins.
# An omitted field keeps its previous value; an explicit zero removes that reward.
# Only direct rewards belong here. Native random drops and special-object rewards are separate.
version = 1

# =========================================
# Transport: first activation only
# =========================================

[transPoint."kind=waypoint"]
adventureExp = 50
primogems = 5

[transPoint."kind=statue"]
adventureExp = 50
primogems = 5

[transPoint."kind=domain"]
adventureExp = 50
primogems = 5

# The tutorial waypoint only gives 10 Adventure EXP, without primogems.
# Explicitly clear the inherited 5 Primogems.
[transPoint."3:6"]
adventureExp = 10
primogems = 0

# Three Realms Gateway Offering. Explicitly clear ordinary waypoint EXP.
[transPoint."7:*"]
adventureExp = 0
primogems = 5
items = [{ id = 101692, count = 20 }]

# =========================================
# Chest: four standard exploration qualities
# =========================================
# Selectors: kind=common, kind=common,area=3:1, kind=common,area=3:1:104.
# Defaults first, broad historical regions next, exact high-gem exceptions last.

# High-Primogem-area defaults (including modern regions not listed below).
[chest."kind=common"]
adventureExp = 30
primogems = 2

[chest."kind=exquisite"]
adventureExp = 30
primogems = 5

[chest."kind=precious"]
adventureExp = 30
primogems = 10

[chest."kind=luxurious"]
adventureExp = 30
primogems = 10

# Historical low-Primogem areas only (Mondstadt/Liyue); do not add modern areas
# solely because they belong to the same nation.
# Dragonspine (3:10), Lisha (3:8), and Chasm (3:19, 6:300) use the defaults.

