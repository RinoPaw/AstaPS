# Standard exploration chest fixed rewards. Generated once at ./rewards.toml.
# The operator owns that file; later server updates never overwrite it.
# Only kind and optional area are valid selectors.
# Matching tables apply top to bottom; later fields override earlier fields.
# Missing fields keep their preceding value. Explicit zero clears that reward.
# Order your defaults first, broad areas next, and precise exceptions last.
# 'items = [{ id = 104001, count = 2 }]' adds direct item rewards.
# Random drops, quest items, Shrine of Depths, events and remarkable chests are separate.

# High-Primogem-area defaults (including modern regions not listed below).
[chest."kind=common"]
adventureExp = 30
primogems = 2

[chest."kind=exquisite"]
adventureExp = 30
primogems = 5

[chest."kind=precious"]
adventureExp = 30
primogems = 10

[chest."kind=luxurious"]
adventureExp = 30
primogems = 10

