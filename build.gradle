import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.plugins.ide.eclipse.model.SourceFolder

plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id 'com.diffplug.spotless' version '8.10.3'

    id 'eclipse'
    id 'idea'

    id 'io.freefair.lombok' version '9.8.0'
}

spotless {
    java {
        target fileTree(rootDir) {
            include '**/*.java'
            exclude '**/generated/**/*.*'
            exclude '.idea/**/*.*'
        }

        importOrder('io.grasscutter', '', 'java', 'javax', '\\#java', '\\#')
        googleJavaFormat('1.17.0')
        formatAnnotations()
        endWithNewline()
        leadingSpacesToTabs(2); leadingTabsToSpaces(4)
        toggleOffOn()
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.with {
        // ~5,500 generated protocol classes; with 3000m javac stalls in GC.
        memoryMaximumSize = '6g'
    }
}

compileTestJava.options.encoding = 'UTF-8'

group = 'io.grasscutter'
version = '7.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.release.set(21)
}

repositories {
    mavenCentral()
}

def nettyVersion = '4.1.138.Final'

dependencies {
    // KCP is a custom/unpublished build and remains vendored until its upstream is identified.
    implementation files('lib/kcp-1.5.1.jar')

    implementation 'at.favre.lib:bcrypt:0.10.2'

    implementation 'it.unimi.dsi:fastutil:8.5.19'

    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation 'ch.qos.logback:logback-core:1.5.36'
    implementation 'ch.qos.logback:logback-classic:1.5.36'

    // Picocli 4.7.7 still depends on the old all-in-one JLine 3.29.0 bundle. Use the current
    // JLine modules explicitly so the console does not mix bundle classes with newer modules.
    implementation 'org.jline:jline-reader:3.30.14'
    implementation 'org.jline:jline-console:3.30.14'
    implementation 'org.jline:jline-terminal-jna:3.30.14'
    implementation 'info.picocli:picocli:4.7.7'
    implementation('info.picocli:picocli-shell-jline3:4.7.7') {
        exclude group: 'org.jline', module: 'jline'
    }

    // KCP uses Netty's core transport APIs plus epoll/kqueue classes. The platform-specific
    // classifier JARs carry the JNI libraries that make Epoll.isAvailable()/KQueue.isAvailable()
    // succeed; without them the server silently falls back to NIO.
    implementation platform("io.netty:netty-bom:${nettyVersion}")
    implementation 'io.netty:netty-common'
    implementation 'io.netty:netty-buffer'
    implementation 'io.netty:netty-transport'
    implementation 'io.netty:netty-transport-classes-epoll'
    implementation 'io.netty:netty-transport-classes-kqueue'
    runtimeOnly "io.netty:netty-transport-native-epoll:${nettyVersion}:linux-x86_64"
    runtimeOnly "io.netty:netty-transport-native-epoll:${nettyVersion}:linux-aarch_64"
    runtimeOnly "io.netty:netty-transport-native-kqueue:${nettyVersion}:osx-x86_64"
    runtimeOnly "io.netty:netty-transport-native-kqueue:${nettyVersion}:osx-aarch_64"

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.protobuf:protobuf-java:4.36.2'

    implementation 'org.reflections:reflections:0.10.2'
    implementation 'com.esotericsoftware:reflectasm:1.11.9'
    implementation 'com.github.davidmoten:rtree-multi:0.1'

    implementation 'dev.morphia.morphia:morphia-core:2.5.3'

    implementation 'org.quartz-scheduler:quartz:2.5.2'

    implementation 'org.luaj:luaj-jse:3.0.1'

    // Javalin 7 moves route registration into startup configuration and runs on Jetty 12.
    implementation 'io.javalin:javalin:7.2.3'
    implementation 'io.javalin.community.ssl:javalin-ssl:7.2.3'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // javax.annotation is no longer part of the JDK. Keep the source-level nullability annotations
    // explicit without packaging them into the server runtime.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j'
}

application {
    mainClass.set('emu.grasscutter.Grasscutter')
}

tasks.named('jar') {
    exclude '*.proto'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    manifest {
        attributes 'Main-Class': 'emu.grasscutter.Grasscutter'
    }

    archiveBaseName = 'grasscutter'

    if (project.hasProperty('jarFilename')) {
        archiveFileName = "${jarFilename}.${archiveExtension.get()}"
    }

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from('src/main/java') {
        include '*.xml'
    }

    destinationDirectory = file('.')
}
